<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivial Pursuit Scorekeeper</title>
    <meta
      name="description"
      content="Track Trivial Pursuit wedges for two to four teams. Click a pie slice to award that color."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="felt" aria-hidden="true"></div>
    <main class="app">
      <header class="masthead">
        <p class="eyebrow">Game night scorekeeper</p>
        <h1>Trivial Pursuit</h1>
        <p class="lede">
          Choose two to four teams, then tap a pie wedge to add that color to a
          team’s score.
        </p>
      </header>

      <section id="setup" class="panel setup" aria-labelledby="setup-heading">
        <h2 id="setup-heading">Set up the table</h2>
        <p class="panel-copy">How many teams are playing?</p>
        <div class="count-picker" role="group" aria-label="Number of teams">
          <button type="button" class="count-btn" data-count="2">2</button>
          <button type="button" class="count-btn" data-count="3">3</button>
          <button type="button" class="count-btn" data-count="4">4</button>
        </div>
        <div id="team-names" class="team-names"></div>
        <button type="button" id="start-btn" class="primary-btn">
          Start game
        </button>
      </section>

      <section
        id="board"
        class="board is-hidden"
        aria-labelledby="board-heading"
        hidden
      >
        <div class="board-toolbar">
          <h2 id="board-heading">Wedges</h2>
          <div class="toolbar-actions">
            <button type="button" id="reset-btn" class="ghost-btn">
              Reset wedges
            </button>
            <button type="button" id="new-game-btn" class="ghost-btn">
              New game
            </button>
          </div>
        </div>
        <p class="hint">
          Click a colored slice on a team’s pie to award that wedge. Click it
          again to take it back.
        </p>
        <div id="legend" class="legend"></div>
        <div id="teams" class="teams"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
